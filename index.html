<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d6b5f"><meta name="description" content="Personal badminton string inventory and stringing history.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=4">
  <title>StringTracker</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-mark">S</span><span>String<span>Tracker</span></span></a>
      <nav id="nav"><button class="nav-link active" data-page="dashboard">⌂ <span>Dashboard</span></button><button class="nav-link" data-page="rolls">◉ <span>My Rolls</span></button><button class="nav-link" data-page="history">◷ <span>Stringing History</span></button><button class="nav-link" data-page="statistics">◔ <span>Statistics</span></button><button class="nav-link" data-page="settings">⚙ <span>Settings</span></button></nav>
      <div class="sidebar-bottom"><button id="themeToggle" class="plain-button">☾ <span>Dark mode</span></button><p>Private by design<br><small>Stored on this device</small></p></div>
    </aside>
    <main><header class="topbar"><button id="menuButton" class="icon-button mobile-only" aria-label="Menu">☰</button><div><p id="eyebrow">YOUR INVENTORY</p><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button id="installButton" class="secondary small hidden">Install app</button></div></header>
      <div id="offlineStatus" class="offline hidden">You’re offline. Your data is safely available on this device.</div>
      <div id="app"></div>
    </main>
  </div>
  <nav id="mobileNav" aria-label="Main navigation">
    <button data-page="dashboard" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
    <button data-page="rolls" aria-label="My string rolls" title="My string rolls"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M21 12v7a2 2 0 0 0 2 2"/></svg></button>
    <button data-page="history" aria-label="Stringing history" title="Stringing history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6m3-3v5l3 2"/></svg></button>
    <button data-page="statistics" aria-label="Statistics" title="Statistics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 16v-5m5 5V7m5 9V3"/></svg></button>
    <button data-page="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.5 3-2 1-3-.7-2 3.4 2.4 2v2.6l-2.4 2 2 3.4 3-.7 2 1 .5 3h4l.5-3 2-1 3 .7 2-3.4-2.4-2v-2.6l2.4-2-2-3.4-3 .7-2-1L13 3z" transform="translate(1 -1) scale(.95)"/><circle cx="12" cy="12" r="3"/></svg></button>
  </nav>
  <div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
  <script src="app.js?v=4"></script>
</body>
</html>
